<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="105" height="28" viewBox="0 0 105 28" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,'SF Mono','Courier New',monospace">
